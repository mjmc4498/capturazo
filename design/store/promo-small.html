<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="store.css">
<style>
  /* Chrome sin interfaz dibuja como mínimo 500 px de ancho y luego se recorta a 440: se posiciona desde la izquierda. */
  .mini { position: absolute; left: 296px; top: 52px; width: 104px; height: 178px; border-radius: 22px; background: linear-gradient(#fff, #e3e3e8); transform: rotate(8deg); box-shadow: 0 24px 40px -16px rgba(0,0,0,.8); }
  .mini .lens { position: absolute; left: 22px; top: 50px; width: 60px; height: 60px; border-radius: 50%; background: #1c1c21; box-shadow: 0 0 40px 10px rgba(30,200,255,.45); }
  .mini .lens::before { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: linear-gradient(135deg, #7debff, #0a84ff); }
  .mini .lens::after { content: ""; position: absolute; inset: 21px; border-radius: 50%; background: #061423; }
  .mini .slot { position: absolute; left: 38px; top: 10px; width: 28px; height: 6px; border-radius: 3px; background: #c7c7cc; }
</style></head>
<body class="dark" style="background:radial-gradient(260px 200px at 350px 60%, rgba(30,200,255,.26), transparent 70%), #0b0b0c"><div class="stage">
  <div style="position:absolute;left:30px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:250px">
    <img src="../../extension/icons/icon-128.png" style="width:80px;height:80px;margin:-10px 0 2px -10px">
    <div style="font-size:38px;font-weight:750;letter-spacing:-.045em">Capturazo</div>
    <div style="margin-top:6px;font-size:16px;line-height:1.4;color:#a1a1a6">Tu celular como cámara<br>y micrófono</div>
  </div>
  <div class="mini"><span class="slot"></span><span class="lens"></span></div>
</div></body></html>
