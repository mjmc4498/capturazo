<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capturazo</title>
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="popup.css">
  <script src="lib/relay.js"></script>
  <script src="popup.js" type="module"></script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <img src="icons/icon-32.png" width="22" height="22" alt="">
      <span>Capturazo</span>
    </div>
    <span class="pill" id="status" data-tone="muted"><i></i><span id="status-text" data-i18n="statusStarting"></span></span>
  </header>

  <main>
    <section class="scan" id="scan">
      <div class="qr-card" id="qr-card">
        <div class="qr" id="qr" role="img" data-i18n-aria="qrAlt"></div>
        <div class="qr-loading" id="qr-loading"><span class="spinner"></span></div>
      </div>
      <h1 data-i18n="scanTitle"></h1>
      <p class="muted" data-i18n="scanBody"></p>
    </section>

    <section class="stopped" id="stopped" hidden>
      <div class="stopped-icon">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
      </div>
      <h1 data-i18n="stoppedTitle"></h1>
      <p class="muted" data-i18n="stoppedBody"></p>
      <button class="btn primary" id="start" data-i18n="start"></button>
    </section>

    <p class="alert" id="alert" hidden></p>

    <!-- Señal del celular -->
    <section class="live" id="live" hidden>
      <div class="screen" id="screen">
        <video id="preview" muted playsinline autoplay></video>
        <div class="screen-wait" id="screen-wait"><span class="spinner light"></span><span id="screen-wait-text"></span></div>
        <div class="screen-top">
          <span class="tag" id="dev-tag"><i></i><span id="dev-name"></span></span>
          <span class="tag rec" id="rec-tag" hidden><i></i><span id="rec-time">00:00</span></span>
        </div>
        <span class="tag res" id="res-tag" hidden></span>
      </div>

      <div class="cams" id="cams" role="radiogroup" data-i18n-aria="cameras"></div>

      <div class="mic-line">
        <span class="label" data-i18n="micLabel"></span>
        <div class="seg" id="mode" role="radiogroup" data-i18n-aria="micLabel">
          <button type="button" role="radio" data-mode="normal" data-i18n="modeNormal"></button>
          <button type="button" role="radio" data-mode="nr" data-i18n="modeNr"></button>
        </div>
      </div>

      <div class="tools">
        <button class="tool" id="mic-btn" type="button" aria-pressed="true" data-i18n-title="micToggle">
          <svg class="on" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M15 9.3V5a3 3 0 0 0-5.7-1.3"/><path d="M9 9v2a3 3 0 0 0 5.1 2.1"/><path d="M19 10v1a7 7 0 0 1-.7 3M16.9 16.9A7 7 0 0 1 5 11v-1M12 18v4"/></svg>
          <span data-i18n="mic"></span>
        </button>
        <button class="tool" id="cam-btn" type="button" aria-pressed="true" data-i18n-title="camToggle">
          <svg class="on" viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="m2 2 20 20"/><path d="M10.7 6H14a2 2 0 0 1 2 2v3.3l1 1L22 7v10"/><path d="M16 16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h2"/></svg>
          <span data-i18n="camera"></span>
        </button>
        <button class="tool" id="flip-btn" type="button" data-i18n-title="flipTitle">
          <svg viewBox="0 0 24 24"><path d="M20 7h-3.5L14 4h-4L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M9 13.5a3 3 0 0 1 5.2-2l.8.8M15 13.5a3 3 0 0 1-5.2 2l-.8-.8"/><path d="M15 9.5v3h-3M9 17.5v-3h3"/></svg>
          <span data-i18n="flip"></span>
        </button>
        <button class="tool" id="photo-btn" type="button" data-i18n-title="photoTitle">
          <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span data-i18n="photo"></span>
        </button>
        <button class="tool rec" id="rec-btn" type="button" aria-pressed="false" data-i18n-title="recTitle">
          <i class="rec-dot"></i>
          <span id="rec-label" data-i18n="record"></span>
        </button>
      </div>

      <button class="btn visor-btn" id="open-visor" type="button">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
        <span data-i18n="openVisor"></span>
      </button>
    </section>

    <section class="card devices" id="devices-card" hidden>
      <div class="label" data-i18n="devicesTitle"></div>
      <ul id="devices"></ul>
    </section>

    <section class="card site" id="site-card" hidden>
      <div class="site-row">
        <img id="site-icon" width="16" height="16" alt="" hidden>
        <span class="site-fallback" id="site-fallback"></span>
        <span class="site-text">
          <span class="site-title" id="site-title"></span>
          <span class="site-sub muted" id="site-sub"></span>
        </span>
        <button class="btn small primary" id="site-enable" type="button" data-i18n="siteEnable" hidden></button>
        <span class="site-ok" id="site-ok" hidden>
          <svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
      </div>
      <button class="btn small ghost site-reload" id="site-reload" type="button" data-i18n="siteReload" hidden></button>
    </section>

    <p class="saved muted" id="saved" hidden></p>
  </main>

  <footer class="actions">
    <button class="btn ghost" id="copy" data-i18n-title="copyLinkTitle">
      <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      <span data-i18n="copyLink"></span>
    </button>
    <button class="btn ghost" id="show-qr" hidden data-i18n-title="showQrTitle">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v1M14 20h1M17 20h4v-3"/></svg>
      <span data-i18n="showQr"></span>
    </button>
    <button class="btn ghost" id="reset" data-i18n-title="newCodeTitle">
      <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>
      <span data-i18n="newCode"></span>
    </button>
    <span class="spacer"></span>
    <button class="btn icon" id="stop" data-i18n-title="stop" data-i18n-aria="stop">
      <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
    </button>
    <button class="btn icon" id="options" data-i18n-title="settings" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </footer>
</body>
</html>
