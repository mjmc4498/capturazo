<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reunión del equipo · Sala de prueba</title>
<!--
  Página de prueba con forma de videollamada genérica: lista las cámaras y micrófonos
  del sitio (getUserMedia / enumerateDevices) como lo hace cualquier videollamada web.
  La usan test/e2e.mjs y las capturas de la tienda.
-->
<style>
  :root { --bg: #0f1115; --panel: #181b21; --panel-2: #20242c; --text: #eef0f4; --muted: #8b919c; --accent: #3b82f6; color-scheme: dark; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,.06); }
  header .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #60a5fa, #6366f1); }
  header h1 { margin: 0; font-size: 16px; font-weight: 600; }
  header .time { margin-left: auto; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 340px; gap: 20px; padding: 20px 24px; }
  .stage { position: relative; aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #000; }
  .stage video { width: 100%; height: 100%; object-fit: cover; display: block; transform: scaleX(-1); }
  .stage .me { position: absolute; left: 14px; bottom: 14px; padding: 6px 12px; border-radius: 10px; background: rgba(0,0,0,.6); font-weight: 600; font-size: 13px; }
  .stage .off { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 14px; }
  .person { position: relative; aspect-ratio: 16 / 7; border-radius: 14px; background: var(--panel); display: grid; place-items: center; }
  .person .av { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 20px; color: #fff; }
  .person span { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); }
  aside { display: flex; flex-direction: column; gap: 14px; }
  .card { padding: 16px; border-radius: 16px; background: var(--panel); }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; }
  label { display: block; margin: 12px 0 6px; color: var(--muted); font-size: 12.5px; }
  select { width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: var(--panel-2); color: var(--text); font: inherit; }
  .meter { height: 8px; margin-top: 10px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22c55e, #84cc16); transition: width .08s linear; }
  .bar { display: flex; justify-content: center; gap: 12px; margin-top: 16px; }
  .bar button { height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: var(--panel-2); color: var(--text); font: 600 14px/1 inherit; font-family: inherit; cursor: pointer; }
  .bar button.join { background: var(--accent); }
  .bar button.leave { background: #ef4444; }
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>Reunión del equipo</h1>
  <span class="time" id="clock">10:30</span>
</header>
<main>
  <section>
    <div class="stage">
      <video id="video" autoplay playsinline muted></video>
      <div class="off" id="off">Cámara apagada</div>
      <div class="me">Tú</div>
    </div>
    <div class="people">
      <div class="person"><div class="av" style="background:#f59e0b">AL</div><span>Ana López</span></div>
      <div class="person"><div class="av" style="background:#10b981">JR</div><span>Jorge Ramos</span></div>
      <div class="person"><div class="av" style="background:#8b5cf6">SM</div><span>Sofía Medina</span></div>
    </div>
  </section>
  <aside>
    <div class="card">
      <h2>Audio y video</h2>
      <label for="cam">Cámara</label>
      <select id="cam"></select>
      <label for="mic">Micrófono</label>
      <select id="mic"></select>
      <div class="meter"><i id="level"></i></div>
    </div>
    <div class="bar">
      <button class="join" id="join" type="button">Unirse</button>
      <button class="leave" id="leave" type="button">Salir</button>
    </div>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const video = $('video');
  let stream = null;
  let analyser = null;
  let level = 0;

  async function listDevices() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const fill = (select, kind) => {
      const current = select.value;
      select.replaceChildren(...devices.filter((d) => d.kind === kind).map((d, i) => new Option(d.label || `${kind} ${i + 1}`, d.deviceId)));
      if ([...select.options].some((o) => o.value === current)) select.value = current;
    };
    fill($('cam'), 'videoinput');
    fill($('mic'), 'audioinput');
    return devices.map((d) => ({ kind: d.kind, deviceId: d.deviceId, label: d.label }));
  }

  async function start(cam = $('cam').value, mic = $('mic').value) {
    stop();
    const constraints = {
      video: cam === 'generic' ? true : { deviceId: { exact: cam }, width: { ideal: 1280 } },
      audio: mic === 'generic' ? true : { deviceId: { exact: mic } },
    };
    stream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = stream;
    $('off').hidden = true;
    const ctx = new AudioContext();
    const src = ctx.createMediaStreamSource(new MediaStream(stream.getAudioTracks()));
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    src.connect(analyser);
    return stream.getTracks().map((t) => ({ kind: t.kind, label: t.label, settings: t.getSettings() }));
  }

  function stop() {
    for (const t of stream?.getTracks() || []) t.stop();
    stream = null;
    video.srcObject = null;
    analyser = null;
    $('off').hidden = false;
  }

  // Color medio del centro del video (para saber si llega la imagen del celular o la de espera).
  function frameStats() {
    if (!video.videoWidth) return null;
    const c = document.createElement('canvas');
    c.width = 64; c.height = 36;
    const g = c.getContext('2d');
    g.drawImage(video, 0, 0, 64, 36);
    const d = g.getImageData(0, 0, 64, 36).data;
    let r = 0, gr = 0, b = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; gr += d[i + 1]; b += d[i + 2]; }
    const n = d.length / 4;
    return { w: video.videoWidth, h: video.videoHeight, r: r / n, g: gr / n, b: b / n };
  }

  function audioLevel() {
    if (!analyser) return 0;
    const data = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(data);
    let sum = 0;
    for (const v of data) sum += v * v;
    return Math.sqrt(sum / data.length);
  }

  setInterval(() => {
    const v = audioLevel();
    level = Math.max(v * 4, level * 0.85);
    $('level').style.width = `${Math.min(100, level * 100)}%`;
  }, 60);

  $('join').addEventListener('click', () => start().catch((e) => alert(e.message)));
  $('leave').addEventListener('click', stop);
  $('cam').addEventListener('change', () => { if (stream) start(); });
  $('mic').addEventListener('change', () => { if (stream) start(); });
  navigator.mediaDevices.addEventListener('devicechange', listDevices);
  listDevices();

  // Diagnóstico: cuántos cuadros de audio llegan por la pista del sitio y por la señal de Capturazo.
  let capturazoSource = null;
  document.addEventListener('capturazo:stream', (e) => { capturazoSource = e.relatedTarget?.srcObject || null; });
  async function countFrames(track, ms = 1000) {
    if (!track || typeof MediaStreamTrackProcessor !== 'function') return -1;
    const reader = new MediaStreamTrackProcessor({ track: track.clone() }).readable.getReader();
    let n = 0;
    let sum = 0;
    let count = 0;
    let format = '';
    const end = Date.now() + ms;
    const timer = setTimeout(() => reader.cancel(), ms);
    try {
      while (Date.now() < end) {
        const { value, done } = await reader.read();
        if (done) break;
        if (value.numberOfFrames) {
          format = value.format;
          const buf = new Float32Array(value.numberOfFrames);
          value.copyTo(buf, { planeIndex: 0, format: 'f32-planar' });
          for (const v of buf) { sum += v * v; count++; }
        }
        value.close();
        n++;
      }
    } catch {}
    clearTimeout(timer);
    return { n, rms: count ? Math.sqrt(sum / count) : 0, format };
  }
  async function diag() {
    const a = stream?.getAudioTracks()[0];
    const s = capturazoSource?.getAudioTracks()[0];
    return {
      page: a ? { label: a.label, state: a.readyState, muted: a.muted, frames: await countFrames(a) } : null,
      source: s ? { state: s.readyState, muted: s.muted, frames: await countFrames(s) } : null,
      ctx: analyser?.context.state,
    };
  }

  window.__test = { listDevices, start, stop, frameStats, audioLevel, diag, tracks: () => stream?.getTracks().map((t) => ({ kind: t.kind, label: t.label, state: t.readyState })) || [] };
</script>
</body>
</html>
